<!DOCTYPE html>
<html>
    <head>
        <title>
            HDS Home
        </title>
        <link href="style.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <script src="script.js"></script>
        <div class="topbar">
            <div id="auth-status"></div>
            <button id="sign-in-btn">Sign In</button>
        </div>

        <h1><b>Welcome to HDS!</b></h1>
        <p>HDS is a subsidarary of the <a href="https://www.thesmartcat76.github.io/THDCC/">Twisted Hot Dawg Coding Club(Do not click)</a></p>
        <button onclick="move('nav.html');">Navigation</button>

        <div id="signin-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close" id="signin-close">&times;</span>
                <h2>Sign In</h2>
                <form id="signin-form">
                    <label>Username
                        <input type="text" id="username" name="username" required>
                    </label>
                    <label>Password
                        <input type="password" id="password" name="password" required>
                    </label>
                    <button type="submit">Sign In</button>
                </form>
            </div>
        </div>
    </body>
</html>
